name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Static checks
        run: go vet ./...
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          output=xsscan
          if [[ "$RUNNER_OS" == "Windows" ]]; then output=xsscan.exe; fi
          go build -trimpath -ldflags '-s -w' -o "$output" ./cmd
          "./$output" --version
          "./$output" --help
